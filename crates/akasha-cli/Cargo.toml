[package]
name = "akasha-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "akasha"
path = "src/main.rs"

[dependencies]
akasha-core = { path = "../akasha-core" }
clap.workspace = true
serde_json.workspace = true
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "bracketed-paste"] }
ratatui-textarea = { version = "=0.9.2", default-features = false, features = ["crossterm"] }
